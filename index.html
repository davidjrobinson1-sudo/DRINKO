<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1597e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DRINKO" />
  <title>DRINKO</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <img src="drinko-logo.png" alt="DRINKO" class="logo" />
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
    </header>

    <section class="hero-card">
      <p id="greeting" class="eyebrow">GOOD AFTERNOON</p>
      <h1 id="headline">Time for some water 💧</h1>
      <p id="subline">Have <strong id="dueGlasses">1 glass</strong> now.</p>

      <div class="big-drop" aria-hidden="true">💧</div>

      <button id="doneBtn" class="primary">✓ I'VE DRUNK IT</button>
      <button id="notYetBtn" class="secondary">NOT YET</button>
      <button id="addBtn" class="ghost">+ I DRANK A GLASS</button>
    </section>

    <section class="progress-card">
      <div class="progress-head">
        <div>
          <span class="muted">TODAY</span>
          <div class="stat"><span id="glassesToday">0</span> glasses</div>
        </div>
        <div class="right">
          <span id="mlToday">0 ml</span>
          <small>of <span id="targetMl">2500</span> ml</small>
        </div>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
      <p class="next">Next reminder: <strong id="nextReminder">—</strong></p>
    </section>

    <section class="history-card">
      <h2>Today</h2>
      <div id="history" class="history"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings">
      <div class="dialog-head">
        <h2>DRINKO settings</h2>
        <button value="cancel" class="icon-btn">✕</button>
      </div>

      <label>Start time
        <input id="startTime" type="time" value="08:00" />
      </label>
      <label>Finish time
        <input id="finishTime" type="time" value="22:00" />
      </label>
      <label>Reminder every
        <select id="intervalMins">
          <option value="60">1 hour</option>
          <option value="90">1½ hours</option>
          <option value="120" selected>2 hours</option>
          <option value="180">3 hours</option>
        </select>
      </label>
      <label>Glass size
        <select id="glassMl">
          <option value="200">200 ml</option>
          <option value="250" selected>250 ml</option>
          <option value="300">300 ml</option>
          <option value="350">350 ml</option>
          <option value="500">500 ml</option>
        </select>
      </label>
      <label>Daily target
        <input id="dailyTarget" type="number" min="500" max="6000" step="250" value="2500" />
        <span class="suffix">ml</span>
      </label>

      <button id="notifyBtn" type="button" class="secondary">Enable notifications</button>
      <button id="saveSettings" value="default" class="primary">SAVE</button>
      <button id="resetToday" type="button" class="danger">Reset today</button>

      <p class="fineprint">
        DRINKO tracks the target you choose. It does not calculate a medically appropriate fluid target.
      </p>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
